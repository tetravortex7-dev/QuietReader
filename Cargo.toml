[package]
name = "QuietReader"
version = "0.13.0"
edition = "2024"
description = "A fast, lightweight cross-platform ebook, document, and comic reader"
license = "LicenseRef-Proprietary"
publish = false
repository = "https://github.com/tetravortex7-dev/QuietReader"
readme = "README.md"
keywords = ["ebook", "reader", "epub", "pdf", "comics"]
categories = ["gui", "text-processing"]

[[bin]]
name = "QuietReader"
path = "src/main.rs"
test = false

[[bin]]
name = "qr-keygen"
path = "src/bin/qr_keygen/main.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "clipboard"] }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
encoding_rs = { version = "0.8.44", default-features = false, features = ["alloc"] }
quick-xml = { version = "0.42.0", default-features = false }
rfd = { version = "0.18.0", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
sevenz-rust = { version = "0.6.1", default-features = false }
unrar-rs = { version = "0.16.1", default-features = false, features = ["crypto-host"] }
hayro = { version = "0.9.0", default-features = false, features = ["embed-fonts", "embed-cmaps"] }
djvu-rs = { version = "0.45.0", default-features = false, features = ["std"] }
tts = { version = "0.26.3", default-features = false }
msedge-tts = { version = "0.4.1", default-features = false, features = ["blocking"] }
rodio = { version = "0.23.0", default-features = false, features = ["playback", "symphonia-mp3", "symphonia-wav"] }
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "gzip"] }
url = { version = "2.5.8", default-features = false, features = ["std"] }
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
lzma-rs = { version = "0.3.0", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
tar = { version = "0.4.46", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
mobi = { version = "0.8.0", default-features = false }

[target.'cfg(windows)'.dependencies]
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["x11", "wayland"] }
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal", "wayland"] }
tts = { version = "0.26.3", default-features = false, features = ["speech_dispatcher_0_11"] }
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }

[dev-dependencies]
sevenz-rust = { version = "0.6.1", default-features = false, features = ["compress"] }

[features]
default = []
enable_tests = []

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
