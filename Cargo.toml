[package]
name = "QuietReader"
version = "0.7.1"
edition = "2024"
description = "A fast, lightweight cross-platform ebook, document, and comic reader"
license = "LicenseRef-Proprietary"
publish = false
repository = "https://github.com/tetravortex7-dev/QuietReader"
readme = "README.md"
keywords = ["ebook", "reader", "epub", "pdf", "comics"]
categories = ["gui", "text-processing"]

[[bin]]
name = "QuietReader"
path = "src/main.rs"
test = false

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "clipboard"] }
base64 = "0.23.1"
encoding_rs = "0.8.42"
quick-xml = "0.42.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
sevenz-rust = { version = "0.6.1", default-features = false }
unrar-rs = { version = "0.14.1", default-features = false, features = ["crypto-host"] }
hayro = "0.8.0"
djvu-rs = { version = "0.43.0", default-features = false, features = ["std"] }
tts = "0.26.3"
msedge-tts = "0.4.1"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "symphonia-mp3", "symphonia-wav"] }
ureq = "3.5.0"
url = "2.5.8"
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
mobi = { version = "0.8.0", default-features = false }

[target.'cfg(windows)'.dependencies]
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }

[dev-dependencies]
sevenz-rust = { version = "0.6.1", default-features = false, features = ["compress"] }

[features]
default = []
enable_tests = []

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
