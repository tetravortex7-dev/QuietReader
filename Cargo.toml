[package]
name = "QuietReader"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
encoding_rs = "0.8.42"
quick-xml = "0.42.0"
rfd = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
sevenz-rust = { version = "0.6", default-features = false }
unrar-rs = { version = "0.10", default-features = false, features = ["crypto-host"] }
hayro = "0.8.0"
djvu-rs = { version = "0.42.0", default-features = false, features = ["std"] }
tts = "0.26.3"
msedge-tts = "0.4.1"
rodio = { version = "0.23", default-features = false, features = ["playback", "symphonia-mp3", "symphonia-wav"] }
ureq = "3.4"
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
