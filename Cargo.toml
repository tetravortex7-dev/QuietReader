[package]
name = "QuietReader"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.36.2"
encoding_rs = "0.8.42"
quick-xml = "0.42.0"
rfd = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
sevenz-rust = { version = "0.6", default-features = false }
unrar-rs = { version = "0.10", default-features = false, features = ["crypto-host"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
